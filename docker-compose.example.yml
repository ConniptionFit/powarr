# Copy this file to docker-compose.yml and fill in your own values.
# Put POWARR_DB_PASSWORD in a gitignored .env next to the compose file.
# For the auto-updating Komodo setup see deploy/komodo/ and docs/DEPLOYMENT.md.

services:
  powarr:
    # Pull the published image. For a local build instead, swap this for `build: .`
    image: git.pwrs.dev/powers/powarr:latest
    container_name: powarr
    ports:
      - "7979:7979"
    volumes:
      - /path/to/powarr/config:/config
    restart: unless-stopped
    environment:
      - POWARR_DATA_DIR=/config
      # Set to your Postgres connection string. Omit entirely to use the SQLite fallback.
      - POWARR_DB_URL=postgresql://powarr:${POWARR_DB_PASSWORD}@postgres:5432/powarr
    labels:
      - com.centurylinklabs.watchtower.enable=false  # Komodo does the updating
    networks:
      - default
      - postgres_net  # the network your existing postgres container is on

networks:
  postgres_net:
    external: true
    name: postgres_net  # replace with your actual postgres network name
